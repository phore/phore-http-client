name: tests

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
        extensions: curl, dom, mbstring, xml, xmlwriter, yaml
        coverage: none
        tools: composer:v2
    - name: Install dependencies
      run: composer install --no-interaction --prefer-dist --no-progress
    - name: UnitTests
      run: composer test
